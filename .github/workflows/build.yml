name: Build Android TV APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Android App with Local Wrapper Fallback
      uses: android-actions/setup-android@v3

    - name: Compile Debug APK
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: google_apis
        arch: x86_64
        disable-animations: true
        force-avd-creation: false
        corbeil-options: ''
        execute: echo "Skipping emulator execution, compiling via gradle wrapper setup"
